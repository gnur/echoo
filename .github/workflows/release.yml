name: Build and release

# Pull requests: build the multi-arch image (no push) to prove it works.
# Pushes to main: push linux/amd64 + linux/arm64 images to GHCR and create a
# GitHub release numbered v<N>, one higher than the latest v<N> tag.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Never run two releases at once, otherwise both could claim the same number.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine next release
        id: version
        run: |
          # Latest v* tag by version order (e.g. v6.1); the next release bumps
          # its leading number (v6.1 -> v7, v12 -> v13). No tags yet -> v1.
          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          num=$(echo "${last:-v0}" | sed -E 's/^v([0-9]+).*/\1/')
          next="v$(( num + 1 ))"
          echo "last=${last}" >> "$GITHUB_OUTPUT"
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "Next release: ${next} (previous: ${last:-none})"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=sha
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          LAST: ${{ steps.version.outputs.last }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          start=()
          if [ -n "$LAST" ]; then start=(--notes-start-tag "$LAST"); fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes "${start[@]}" \
            --notes "Container image: \`${IMAGE}:${TAG}\` (linux/amd64, linux/arm64)"
