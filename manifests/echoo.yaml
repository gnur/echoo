# Three echoo replicas behind a ClusterIP Service. Each pod answers /api with
# its own random name and its pod name, so the dashboard shows one tile per pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echoo
  namespace: echoo
  labels:
    app.kubernetes.io/name: echoo
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: echoo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Replace pods one at a time so the rollout is easy to follow on the dashboard.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echoo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: echoo
          image: ghcr.io/gnur/echoo:v8
          env:
            # The root filesystem is read-only; don't let bun try to write its
            # transpiler cache.
            - name: BUN_RUNTIME_TRANSPILER_CACHE_PATH
              value: "0"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: echoo
  namespace: echoo
  labels:
    app.kubernetes.io/name: echoo
spec:
  selector:
    app.kubernetes.io/name: echoo
  ports:
    - name: http
      port: 80
      targetPort: http
